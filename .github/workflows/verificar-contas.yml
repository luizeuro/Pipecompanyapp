# Verificação automática das contas de anúncio, 3x por dia.
# Chama a rota /api/cron/check do app na Vercel, protegida pelo CRON_SECRET.
# O GitHub Actions é usado (e não o cron da Vercel) porque o plano Hobby da
# Vercel só permite cron uma vez por dia.
#
# Configurar no GitHub: Settings → Secrets and variables → Actions
#   - Secret   CRON_SECRET = o mesmo valor do CRON_SECRET da Vercel
#   - Variable APP_URL     = endereço do app, ex: https://pipecompanyapp.vercel.app
name: Verificar contas

on:
  schedule:
    # Horário em UTC: 12h, 17h e 22h UTC = 9h, 14h e 19h em Brasília.
    - cron: '0 12,17,22 * * *'
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar a verificação do app
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure a variable APP_URL e o secret CRON_SECRET em Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "${APP_URL%/}/api/cron/check" \
            -H "Authorization: Bearer $CRON_SECRET"
          echo
